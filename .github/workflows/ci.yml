name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_ENV: test
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/mh_os_test
  CI: true

jobs:
  # -----------------------
  # 1️⃣ LINT
  # -----------------------
  lint:
    name: Lint (Backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint --workspace=mh-os-superapp-backend


  # -----------------------
  # 2️⃣ TYPECHECK
  # -----------------------
  typecheck:
    name: Typecheck (Backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck --workspace=mh-os-superapp-backend


  # -----------------------
  # 3️⃣ UNIT TESTS (DB-FREE)
  # -----------------------
  test-unit:
    name: Test (Unit)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Unit Tests
        run: |
          npm run test \
            --workspace=mh-os-superapp-backend \
            -- --testMatch "**/tests/unit/**/*.unit.test.ts"


  # -----------------------
  # 4️⃣ INTEGRATION TESTS (WITH DB)
  # -----------------------
  test-integration:
    name: Test (Integration)
    runs-on: ubuntu-latest
    needs: [test-unit]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mh_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

          
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/back-end/prisma/schema.prisma

      - name: Deploy Prisma Migrations (TEST DB)
        run: npx prisma migrate deploy --schema=apps/back-end/prisma/schema.prisma

      - name: Run Integration Tests
        run: npm run test:integration --workspace=mh-os-superapp-backend
