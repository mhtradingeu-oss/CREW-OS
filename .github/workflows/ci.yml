name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mh_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mh_os_test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/back-end/package-lock.json


            
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/back-end/prisma/schema.prisma

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy --schema=apps/back-end/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck --workspace=mh-os-superapp-backend

      - name: Lint
        run: npm run lint --workspace=mh-os-superapp-backend

      - name: Test (unit + integration)
        run: npm run test --workspace=mh-os-superapp-backend
