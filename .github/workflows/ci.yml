name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]



jobs:
  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Env Guard (fail if DATABASE_URL is set)
        run: |
          if [ ! -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL must NOT be set in CI. Use DATABASE_URL_TEST only." >&2
            exit 1
          fi

      - name: Build shared packages
        run: npm run build --workspace=@mh-os/shared

      - name: Run linter
        run: npm run lint --workspace=mh-os-superapp-backend

  typecheck-backend:
    name: Typecheck (Backend)
    runs-on: ubuntu-latest
    needs: [lint-backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Env Guard (fail if DATABASE_URL is set)
        run: |
          if [ ! -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL must NOT be set in CI. Use DATABASE_URL_TEST only." >&2
            exit 1
          fi

      - name: Build shared packages
        run: npm run build --workspace=@mh-os/shared

      - name: Run typecheck
        run: npm run typecheck --workspace=mh-os-superapp-backend

  test-unit-backend:
    name: Test (Unit)
    runs-on: ubuntu-latest
    needs: [typecheck-backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Env Guard (fail if DATABASE_URL is set)
        run: |
          if [ ! -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL must NOT be set in CI. Use DATABASE_URL_TEST only." >&2
            exit 1
          fi

      - name: Build shared packages
        run: npm run build --workspace=@mh-os/shared

      - name: Run unit tests
        run: |
          npm run test \
            --workspace=mh-os-superapp-backend \
            -- --testMatch "**/tests/unit/**/*.unit.test.ts"

  test-integration-backend:
    name: Test (Integration)
    runs-on: ubuntu-latest
    needs: [test-unit-backend]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mh_os_test_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/mh_os_test_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Env Guard (fail if DATABASE_URL is set)
        run: |
          if [ ! -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL must NOT be set in CI. Use DATABASE_URL_TEST only." >&2
            exit 1
          fi

      - name: Build shared packages
        run: npm run build --workspace=@mh-os/shared

      - name: Generate Prisma Client (TEST DB)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: npx prisma generate --schema=apps/back-end/prisma/schema.prisma

      - name: Apply Prisma Migrations (TEST DB)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: npx prisma migrate deploy --schema=apps/back-end/prisma/schema.prisma

      - name: Migration Guard (warn on duplicate tables)
        run: |
          node apps/back-end/scripts/migration-guard.js || true

      - name: Run integration tests
        env:
          DATABASE_URL_TEST: ${{ env.DATABASE_URL_TEST }}
        run: npm run test:integration --workspace=mh-os-superapp-backend

      - name: Cleanup (always)
        if: always()
        run: bash scripts/cleanup-local-artifacts.sh || true
