name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mh_os_test

jobs:
  # -----------------------
  # 1️⃣ LINT
  # -----------------------
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint --workspace=mh-os-superapp-backend


  # -----------------------
  # 2️⃣ TYPECHECK
  # -----------------------
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck --workspace=mh-os-superapp-backend


  # -----------------------
  # 3️⃣ TEST (UNIT + INTEGRATION)
  # -----------------------
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mh_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/back-end/prisma/schema.prisma

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy --schema=apps/back-end/prisma/schema.prisma

      - name: Test: Unit
        run: |
          npm run test \
            --workspace=mh-os-superapp-backend \
            -- --testMatch "**/tests/unit/**/*.unit.test.ts"

      - name: Test: Integration
        run: |
          npm run test:integration --workspace=mh-os-superapp-backend
